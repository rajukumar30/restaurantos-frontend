name: Frontend CI

on:
  push:
    branches: [main, develop, "chore/**", "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Verify theme contrast
        run: node --test tests/guest-theme.test.mjs tests/guest-order-progress.test.mjs
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
